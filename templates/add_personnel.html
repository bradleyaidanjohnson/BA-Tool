{% extends 'base.html' %}
{% block content %}
<h2>{{ 'Edit Personnel' if person else 'Add Personnel' }}</h2>
<form method="POST">
  <div class="mb-3">
    <label class="form-label">Name:</label>
    <input type="text" name="name" class="form-control" required value="{{ person.name if person else '' }}" />
  </div>
  <div class="mb-3">
    <label class="form-label">Email:</label>
    <input type="email" name="email" class="form-control" value="{{ person.email if person else '' }}" />
  </div>
  <div class="mb-3">
    <label class="form-label">Role:</label>
    <input type="text" name="role" class="form-control" value="{{ person.role if person else '' }}" />
  </div>
  <div class="mb-3">
    <label class="form-label">Scope:</label>
    <input type="text" name="scope" class="form-control" value="{{ person.scope if person else '' }}" />
  </div>
  <button type="submit" class="btn btn-success">{{ 'Save' if person else 'Add' }}</button>
  <a href="{{ url_for('list_personnel') }}" class="btn btn-secondary">Cancel</a>
</form>

{% if person %}
<form method="POST" action="{{ url_for('delete_personnel', personnel_id=person.id) }}" onsubmit="return confirm('Are you sure you want to delete this personnel?');" class="mt-3">
  <button type="submit" class="btn btn-outline-danger">Delete Personnel</button>
</form>
{% endif %}
{% endblock %}
