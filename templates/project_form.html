{% extends 'base.html' %}
{% block content %}
<h2>{{ 'Edit Project' if project else 'Create New Project' }}</h2>
<form method="POST">
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input name="name" class="form-control" required value="{{ project.name if project else '' }}" />
  </div>
  <div class="mb-3">
    <label class="form-label">Description</label>
    <textarea name="description" class="form-control" required>{{ project.description if project else '' }}</textarea>
  </div>
  <button type="submit" class="btn btn-success">{{ 'Save' if project else 'Create' }}</button>
  <a href="/" class="btn btn-secondary">Cancel</a>
</form>

{% if project %}
<form method="POST" action="{{ url_for('delete_project', project_id=project.id) }}" onsubmit="return confirm('Are you sure you want to delete this project? This action cannot be undone.');" class="mt-3">
  <button type="submit" class="btn btn-outline-danger">Delete Project</button>
</form>
{% endif %}
{% endblock %}
