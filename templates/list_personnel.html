{% extends 'base.html' %}
{% block content %}
<h2>Personnel</h2>
<a href="{{ url_for('add_personnel') }}" class="btn btn-primary mb-3">+ Add Personnel</a>
<a href="{{ url_for('index') }}" class="btn btn-primary mb-3">Home</a>

<table class="table table-striped">
  <thead>
    <tr>
      <th>Name</th>
      <th>Role</th>
      <th>Email</th>
      <th>Scope</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for person in personnel %}
    <tr>
      <td>{{ person.name }}</td>
      <td>{{ person.role or 'N/A' }}</td>
      <td>
        {% if person.email %}
          <a href="mailto:{{ person.email }}">{{ person.email }}</a>
        {% endif %}
      </td>
      <td>{{ person.scope or '' }}</td>
      <td>
        <a href="{{ url_for('edit_personnel', personnel_id=person.id) }}" class="btn btn-sm btn-outline-primary">Edit</a>
        <form
          method="POST"
          action="{{ url_for('delete_personnel', personnel_id=person.id) }}"
          style="display:inline"
          onsubmit="return confirm('Are you sure you want to delete this personnel?');"
        >
          <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
