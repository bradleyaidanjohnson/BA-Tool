<!DOCTYPE html>
<html>
  <head>
    <title>Project Docs Tool</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css"
    />
    <meta name="csrf-token" content="{{ csrf_token() }}">

  </head>
  <style>
    /* Features - subtle background color and left border */
.feature-rank-1 {
  background-color: #fff8e1;  /* very light gold/yellow */
  border-left: 4px solid #ffd700; /* gold */
  padding-left: 0.5rem;
}

.feature-rank-2 {
  background-color: #f0f0f0;  /* light silver/gray */
  border-left: 4px solid #c0c0c0; /* silver */
  padding-left: 0.5rem;
}

.feature-rank-3 {
  background-color: #faf0e6;  /* light warm beige/bronze-ish */
  border-left: 4px solid #cd7f32; /* bronze */
  padding-left: 0.5rem;
}

/* User stories - subtle background with slight shadow/glow */
.story-rank-1 {
  background-color: #fffbea;  /* very light gold */
  box-shadow: 0 0 5px 1px #ffd70088; /* gold glow */
  padding: 0.25rem 0.5rem;
  border-radius: 4px;
}

.story-rank-2 {
  background-color: #f8f8f8;  /* light gray */
  box-shadow: 0 0 5px 1px #c0c0c088; /* silver glow */
  padding: 0.25rem 0.5rem;
  border-radius: 4px;
}

.story-rank-3 {
  background-color: #fff7f0;  /* light warm beige */
  box-shadow: 0 0 5px 1px #cd7f3288; /* bronze glow */
  padding: 0.25rem 0.5rem;
  border-radius: 4px;
}

  </style>
  <body class="p-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div>
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

    <div class="container">
      <h1 class="mb-4">Project Documentation Tool</h1>
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
<script>
  function toggleAdo(storyId) {
    fetch(`/story/${storyId}/toggle_ado`, { method: "POST" })
      .then((res) => res.json())
      .then((data) => {
        if (data.status === "success") {
          location.reload();
        }
      });
  }
  function getCsrfToken() {
  const meta = document.querySelector('meta[name=csrf-token]');
  return meta ? meta.getAttribute('content') : '';
}
</script>
