<!DOCTYPE html>
<html>
  <head>
    <title>Project Docs Tool</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css"
    />
  </head>
  <body class="p-4">
    <div class="container">
      <h1 class="mb-4">Project Documentation Tool</h1>
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
<script>
  function toggleAdo(storyId) {
    fetch(`/story/${storyId}/toggle_ado`, { method: "POST" })
      .then((res) => res.json())
      .then((data) => {
        if (data.status === "success") {
          location.reload();
        }
      });
  }
</script>
