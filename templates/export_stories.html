{% extends 'base.html' %} {% block content %}

<h2>Stories to Add to ADO - {{ project.name }}</h2>

<p>Copy and paste this into ADO:</p>

<pre>
  {% for s in stories %}
    - {{ s.title }}
      - {{ s.details or 'No details given.' }}
  {% endfor %}
</pre>

<a
  href="{{ url_for('view_project', project_id=project.id) }}"
  class="btn btn-secondary"
  >🔙 Back to Project</a
>
{% endblock %}
