{% extends 'base.html' %}
{% block content %}
<h2>Move Feature: {{ feature.title }}</h2>
<form method="POST">
  <label for="new_parent_id">New Parent Feature:</label>
  <select name="new_parent_id" class="form-control">
    <option value="">-- Top Level --</option>
    {% for f in feature_options %}
      <option value="{{ f.id }}">{{ f.path }}</option>
    {% endfor %}
  </select>
  <button type="submit" class="btn btn-primary mt-2">Move</button>
  <button type="button" class="btn btn-secondary mt-2" onclick="window.history.back()">Cancel</button>

</form>
{% endblock %}
